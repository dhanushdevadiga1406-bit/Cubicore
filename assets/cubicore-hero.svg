      <rect x="50" y="6" width="280" height="18" rx="9" fill="#05080e" stroke="#1e293b"/>
      <text x="64" y="18" fill="#64748b" font-size="9" class="font-mono">🔒 http://localhost:3000/todo</text>
      <circle cx="360" cy="15" r="3" fill="#10b981"/>

      <!-- App Content Preview (Todo App) -->
      <g transform="translate(20, 44)">
        <text x="0" y="18" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">📝 Browser Todo App</text>
        <rect x="250" y="4" width="90" height="18" rx="4" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
        <text x="260" y="16" fill="#00f0ff" font-size="9" font-weight="700" class="font-mono">VERIFIED LIVE</text>

        <!-- Todo Items -->
        <rect x="0" y="32" width="340" height="32" rx="6" fill="#111827" stroke="#1f2937"/>
        <rect x="12" y="42" width="12" height="12" rx="3" fill="#10b981"/>
        <text x="32" y="52" fill="#6b7280" font-size="11" text-decoration="line-through" class="font-sans">Define contract write scopes</text>

        <rect x="0" y="70" width="340" height="32" rx="6" fill="#111827" stroke="#1f2937"/>
        <rect x="12" y="80" width="12" height="12" rx="3" fill="#10b981"/>
        <text x="32" y="90" fill="#6b7280" font-size="11" text-decoration="line-through" class="font-sans">Isolate git worktrees on disk</text>

        <rect x="0" y="108" width="340" height="32" rx="6" fill="#111827" stroke="#2563eb"/>
        <rect x="12" y="118" width="12" height="12" rx="3" fill="#1e293b" stroke="#3b82f6"/>
        <text x="32" y="128" fill="#f3f4f6" font-size="11" class="font-sans">Pass mechanical matrix check</text>

        <!-- Preview Stats -->
        <text x="0" y="162" fill="#9ca3af" font-size="10" class="font-mono">Storage: LocalStorage Engine (Serialized)</text>
        <text x="0" y="180" fill="#34d399" font-size="10" class="font-mono">0 Syntax Errors • 0 Broken Buttons</text>
      </g>
    </g>

